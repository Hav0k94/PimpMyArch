- name: Install fish
  become: true
  community.general.pacman:
    name: fish
    state: present

- name: Check directory config
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/fish"
    state: directory
    mode: '755'
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"

- name: Config fish
  ansible.builtin.copy:
    src: files/config.fish
    dest: "{{ ansible_env.HOME }}/.config/fish/config.fish"
    mode: '644'

- name: Display instructions
  ansible.builtin.debug:
    msg: |
      ##### Fish shell installed #####
      To set fish as your default shell, run the following command:
      chsh -s /usr/bin/fish
      Then restart your terminal or log out and log back in.
