---

- name: Install yay using makepkg if it isn't installed already
  kewlfft.aur.aur:
    name: yay
    use: makepkg
    state: present

- name: Install find-the-command
  become: false
  kewlfft.aur.aur:
    use: yay
    name: find-the-command

- name: Install onlyoffice
  become: false
  kewlfft.aur.aur:
    use: yay
    name: onlyoffice-bin
